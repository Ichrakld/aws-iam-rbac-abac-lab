<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
<title id="title">Architecture IAM du lab — modèle central autour du bucket</title>
<desc id="desc">Vue en étoile originale : le bucket S3 est au centre. Alice, membre de developpeurs, lit et écrit public. Bob, membre de auditeurs, lit rapports. Claire, membre de admins-reseau, assume le rôle lecteur-finance via STS. En bas, une condition ABAC SQS compare les tags team.</desc>
<defs>
  <marker id="greenArrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5z" fill="#40d6a1"/></marker>
  <marker id="blueArrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5z" fill="#77a9ff"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#e8eff8}.title{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#a9bad0}.head{font-size:13px;font-weight:700;letter-spacing:1px;fill:#a9bad0}.name{font-size:18px;font-weight:700}.body{font-size:14px;fill:#d1dced}.small{font-size:12px;fill:#a9bad0}.panel{fill:#142338;stroke:#2d4665;stroke-width:1.5}.user{fill:#192e48;stroke:#5681b5;stroke-width:1.5}.policy{fill:#1b2b46;stroke:#8171d1;stroke-width:1.5}.role{fill:#302b1d;stroke:#d3a94e;stroke-width:1.5}.s3{fill:#101c2c;stroke:#40d6a1;stroke-width:2}.object{fill:#172d38;stroke:#367d68;stroke-width:1.3}.flow{fill:none;stroke:#40d6a1;stroke-width:3;marker-end:url(#greenArrow)}.sts{fill:none;stroke:#77a9ff;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#blueArrow)}
  </style>
</defs>
<rect width="1280" height="860" fill="#0b1422"/>
<text x="42" y="53" class="title">Lab IAM · contrôle des accès</text>
<text x="44" y="81" class="sub">RBAC sur S3 · délégation temporaire avec STS · ABAC sur SQS</text>
<rect x="1038" y="33" width="198" height="43" rx="21" fill="#15273d" stroke="#2d4665"/>
<text x="1137" y="60" text-anchor="middle" class="small" font-weight="700">KALI + LOCALSTACK</text>

<!-- Alice -->
<rect x="42" y="130" width="300" height="92" rx="14" class="user"/>
<circle cx="72" cy="166" r="13" fill="#73b5ff"/><path d="M51 204c2-14 10-22 21-22s19 8 21 22z" fill="#73b5ff"/>
<text x="108" y="163" class="name">Alice</text><text x="108" y="187" class="body">utilisatrice · team=data</text><text x="108" y="208" class="small">groupe : developpeurs</text>
<rect x="42" y="239" width="300" height="71" rx="12" class="policy"/>
<text x="61" y="267" class="name">ecriture-public</text><text x="61" y="291" class="body">List · Get · Put sur public/*</text>
<path d="M342 274 C370 274 374 315 405 315" class="flow"/>

<!-- Bob -->
<rect x="42" y="438" width="300" height="92" rx="14" class="user"/>
<circle cx="72" cy="474" r="13" fill="#73b5ff"/><path d="M51 512c2-14 10-22 21-22s19 8 21 22z" fill="#73b5ff"/>
<text x="108" y="471" class="name">Bob</text><text x="108" y="495" class="body">utilisateur · team=audit</text><text x="108" y="516" class="small">groupe : auditeurs</text>
<rect x="42" y="547" width="300" height="71" rx="12" class="policy"/>
<text x="61" y="575" class="name">lecture-rapports</text><text x="61" y="599" class="body">List · Get sur rapports/*</text>
<path d="M342 583 C372 583 376 400 405 400" class="flow"/>

<!-- Central bucket -->
<rect x="405" y="170" width="460" height="375" rx="20" class="s3"/>
<path d="M438 202h28l10 10h-38z" fill="#40d6a1"/><path d="M438 212h44v20h-44z" fill="#40d6a1"/>
<text x="505" y="219" class="name">Bucket S3</text><text x="505" y="241" class="small">tp-iam-ichrak</text>
<rect x="438" y="275" width="394" height="67" rx="11" class="object"/>
<text x="458" y="303" class="name">public/</text><text x="458" y="326" class="body">Alice · lecture et écriture</text><circle cx="798" cy="308" r="13" fill="#40d6a1"/><path d="M792 308l4 4 8-9" fill="none" stroke="#0b1422" stroke-width="2.5"/>
<rect x="438" y="360" width="394" height="67" rx="11" class="object"/>
<text x="458" y="388" class="name">rapports/</text><text x="458" y="411" class="body">Bob · lecture seule</text><circle cx="798" cy="393" r="13" fill="#40d6a1"/><path d="M792 393l4 4 8-9" fill="none" stroke="#0b1422" stroke-width="2.5"/>
<rect x="438" y="445" width="394" height="67" rx="11" class="object"/>
<text x="458" y="473" class="name">finance/</text><text x="458" y="496" class="body">Claire · lecture via lecteur-finance</text><circle cx="798" cy="478" r="13" fill="#40d6a1"/><path d="M792 478l4 4 8-9" fill="none" stroke="#0b1422" stroke-width="2.5"/>

<!-- Claire -->
<rect x="918" y="130" width="320" height="92" rx="14" class="user"/>
<circle cx="949" cy="166" r="13" fill="#73b5ff"/><path d="M928 204c2-14 10-22 21-22s19 8 21 22z" fill="#73b5ff"/>
<text x="985" y="163" class="name">Claire</text><text x="985" y="187" class="body">groupe : admins-reseau</text><text x="985" y="208" class="small">aucun accès S3 direct</text>
<rect x="918" y="239" width="320" height="91" rx="13" class="role"/>
<text x="939" y="270" class="name">lecteur-finance</text><text x="939" y="294" class="body">AssumeRole via STS</text><text x="939" y="315" class="small">session temporaire · lecture finance/*</text>
<path d="M918 285 C895 285 889 478 832 478" class="sts"/>
<text x="882" y="375" class="small" transform="rotate(-73 882 375)">délégation temporaire</text>

<!-- Denied summary -->
<rect x="918" y="373" width="320" height="112" rx="13" class="panel"/>
<text x="940" y="402" class="name" fill="#ffb09e">Refus attendus</text>
<text x="940" y="428" class="small">Alice : rapports/, finance/, Delete</text>
<text x="940" y="450" class="small">Bob : finance/, racine, Put</text>
<text x="940" y="472" class="small">Claire sans rôle : finance/</text>

<!-- ABAC panel -->
<rect x="42" y="676" width="1196" height="142" rx="18" class="panel"/>
<text x="68" y="708" class="head">RÈGLE ABAC · SQS</text>
<text x="68" y="741" class="name">Autoriser si les tags team correspondent</text>
<rect x="470" y="700" width="225" height="74" rx="12" class="user"/>
<text x="582" y="729" text-anchor="middle" class="small">PrincipalTag/team</text><text x="582" y="753" text-anchor="middle" class="body">data</text>
<text x="730" y="746" text-anchor="middle" font-size="27" font-weight="700" fill="#40d6a1">=</text>
<rect x="770" y="700" width="225" height="74" rx="12" class="object"/>
<text x="882" y="729" text-anchor="middle" class="small">ResourceTag/team</text><text x="882" y="753" text-anchor="middle" class="body">data</text>
<rect x="1020" y="700" width="190" height="74" rx="12" fill="#183b32" stroke="#40d6a1" stroke-width="1.5"/>
<text x="1115" y="730" text-anchor="middle" class="name">allowed</text><text x="1115" y="753" text-anchor="middle" class="small">si égalité</text>
<text x="470" y="798" class="small">Essais : data/data → allowed · data/finance et finance/data → implicitDeny</text>
<text x="44" y="844" class="small">Les flèches indiquent les accès autorisés. Les permissions restent limitées au préfixe indiqué.</text>
</svg>
